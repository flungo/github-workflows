# actionlint's `job` context model does not yet include the workflow identity
# properties (`job.workflow_repository` / `job.workflow_sha` — documented by
# GitHub, and used to fetch this repo's composite actions at the workflow
# file's own commit; see ADR-009). Filter exactly that false positive, only
# where the pattern is used — so this list grows by one entry each time a
# workflow starts fetching the actions, and a stale entry is a signal that one
# stopped.
paths:
  .github/workflows/terraform*.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
  .github/workflows/flungo-workflows.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
