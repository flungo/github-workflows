# Self-CI for the composite actions in .github/actions/ — not a reusable
# workflow; consumers never call this. One isolated job per action, so a
# failure names the action in the check list and actions never share a job:
#
#   <action-name>:  behaviour via the action's colocated test.sh, then a
#                   static `uses:` wiring smoke step proving action.yml maps
#                   its inputs (`uses:` can't be templated, so this file
#                   gains one job per action — copy the pattern).
#   coverage:       fails when an action directory lacks an executable
#                   test.sh or a job here, so a new action can't land
#                   untested.
#
# See ADR-009 for why the actions are exercised from this repo's own checkout.
name: Action tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export-terraform-variables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Colocated tests (test.sh)
        run: |
          set -eu
          # The rejection paths print ::error:: on purpose; suspend
          # workflow-command processing so a passing run doesn't collect
          # failure annotations.
          resume_token="action-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "::stop-commands::$resume_token"
          if .github/actions/export-terraform-variables/test.sh; then
            echo "::$resume_token::"
          else
            echo "::$resume_token::"
            echo "::error::export-terraform-variables test.sh failed"
            exit 1
          fi

      # Every value below is fake and exists only for the test.
      - name: Wiring smoke test
        uses: ./.github/actions/export-terraform-variables
        with:
          tf-var-name: TF_VAR_provider_credential
          provider-token: fake-provider-credential-for-the-self-test
          secret-vars: |
            {"db_password": "fake-password\nwith-a-second-line", "api_key": "fake-api-key-value"}
          vars: |
            {"environment": "self-test", "replica_count": "3"}

      - name: Assert the wired environment
        run: |
          set -eu
          expected_password=$'fake-password\nwith-a-second-line'
          [ "$TF_VAR_provider_credential" = "fake-provider-credential-for-the-self-test" ]
          [ "$TF_VAR_db_password" = "$expected_password" ]
          [ "$TF_VAR_api_key" = "fake-api-key-value" ]
          [ "$TF_VAR_environment" = "self-test" ]
          [ "$TF_VAR_replica_count" = "3" ]

  version-check-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Colocated tests (test.sh)
        run: |
          set -eu
          # The rejection paths print ::error:: on purpose; suspend
          # workflow-command processing so a passing run doesn't collect
          # failure annotations.
          resume_token="action-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "::stop-commands::$resume_token"
          if .github/actions/version-check-issue/test.sh; then
            echo "::$resume_token::"
          else
            echo "::$resume_token::"
            echo "::error::version-check-issue test.sh failed"
            exit 1
          fi

      # Fake majors, so this proves the wiring without a second major existing.
      - name: Wiring smoke test
        id: smoke
        uses: ./.github/actions/version-check-issue
        with:
          stale: '[{"major":1,"files":["self-test.yml"]}]'
          target: '3'
          settling: '4'
          guide-path: fixtures/upgrading.md

      - name: Assert the wired outputs
        env:
          TITLE: ${{ steps.smoke.outputs.title }}
          BODY: ${{ steps.smoke.outputs.body }}
        run: |
          set -eu
          base=https://github.com/flungo/github-workflows/blob

          # `if`, not `!`: a bare `!` mid-script skips errexit, so the assertion
          # would pass whatever the body said (SC2251).
          absent() {
            if printf '%s' "$BODY" | grep -qF -- "$1"; then
              echo "::error::unexpected in the issue body: $1"
              exit 1
            fi
          }

          [ "$TITLE" = "Pinned github-workflows major is frozen — v3 available" ]
          printf '%s' "$BODY" | grep -qF -- 'self-test.yml'

          # Each section is read on its own major's branch, never on main.
          printf '%s' "$BODY" | grep -qF -- "]($base/v2/fixtures/upgrading.md#v2)"
          printf '%s' "$BODY" | grep -qF -- "]($base/v3/fixtures/upgrading.md#v3)"
          absent "$base/main/"

          # The settling major is named but is not a destination. `.` stands in
          # for the backticks around it, which cannot be written literally: a
          # backtick reads as a command substitution that won't expand (SC2016).
          printf '%s' "$BODY" | grep -qE '.v4. has also been published'
          absent "$base/v4/"

  issue-upsert:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The smoke step below lists this repo's open issues; it writes nothing.
      issues: read
    steps:
      - uses: actions/checkout@v7

      - name: Colocated tests (test.sh)
        run: |
          set -eu
          # The rejection paths print ::error:: on purpose; suspend
          # workflow-command processing so a passing run doesn't collect
          # failure annotations.
          resume_token="action-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "::stop-commands::$resume_token"
          if .github/actions/issue-upsert/test.sh; then
            echo "::$resume_token::"
          else
            echo "::$resume_token::"
            echo "::error::issue-upsert test.sh failed"
            exit 1
          fi

      # Every other path this action takes writes an issue into the repository
      # it runs in — which here is this one — so the smoke step takes the one
      # that does not: `absent` against a marker and label nothing carries, so
      # the action lists, finds nothing and stops. Create, update and close are
      # covered against a fake client in test.sh.
      - name: Wiring smoke test
        id: smoke
        uses: ./.github/actions/issue-upsert
        with:
          marker: '<!-- issue-upsert-self-test -->'
          label: issue-upsert-self-test
          state: absent
          close-comment: Never posted — nothing carries the self-test marker.

      - name: Assert the wired outputs
        env:
          OUTCOME: ${{ steps.smoke.outputs.outcome }}
          NUMBER: ${{ steps.smoke.outputs.issue-number }}
        run: |
          set -eu
          [ "$OUTCOME" = "none" ] || { echo "::error::expected outcome=none, got '$OUTCOME'"; exit 1; }
          [ -z "$NUMBER" ] || { echo "::error::expected no issue number, got '$NUMBER'"; exit 1; }

  pr-comment-upsert:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The smoke step below lists this pull request's comments; it writes
      # nothing.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Colocated tests (test.sh)
        run: |
          set -eu
          # The rejection paths print ::error:: on purpose; suspend
          # workflow-command processing so a passing run doesn't collect
          # failure annotations.
          resume_token="action-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "::stop-commands::$resume_token"
          if .github/actions/pr-comment-upsert/test.sh; then
            echo "::$resume_token::"
          else
            echo "::$resume_token::"
            echo "::error::pr-comment-upsert test.sh failed"
            exit 1
          fi

      # As with issue-upsert: every other path writes onto a pull request —
      # here, the one under test — so the smoke step takes the one that does
      # not. It needs a pull request to look at, hence the event gate; the
      # tests above run on both events.
      - name: Wiring smoke test
        id: smoke
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/pr-comment-upsert
        with:
          marker: '<!-- pr-comment-upsert-self-test -->'
          state: absent
          issue-number: ${{ github.event.pull_request.number }}

      - name: Assert the wired outputs
        if: github.event_name == 'pull_request'
        env:
          OUTCOME: ${{ steps.smoke.outputs.outcome }}
          COMMENT_ID: ${{ steps.smoke.outputs.comment-id }}
        run: |
          set -eu
          [ "$OUTCOME" = "none" ] || { echo "::error::expected outcome=none, got '$OUTCOME'"; exit 1; }
          [ -z "$COMMENT_ID" ] || { echo "::error::expected no comment id, got '$COMMENT_ID'"; exit 1; }

  check-semantic-line-breaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Colocated tests (test.sh)
        run: |
          set -eu
          # The rejection paths print ::error:: on purpose; suspend
          # workflow-command processing so a passing run doesn't collect
          # failure annotations.
          resume_token="action-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "::stop-commands::$resume_token"
          if .github/actions/check-semantic-line-breaks/test.sh; then
            echo "::$resume_token::"
          else
            echo "::$resume_token::"
            echo "::error::check-semantic-line-breaks test.sh failed"
            exit 1
          fi

      # Two green wiring steps rather than one green and one deliberately red:
      # a `uses:` step cannot be wrapped in ::stop-commands::, so a failing one
      # would decorate every passing run with its annotations. The second step
      # would fail without `ignore:` doing its job, which is what proves the
      # input is wired.
      - name: Wiring smoke test (globs)
        uses: ./.github/actions/check-semantic-line-breaks
        with:
          globs: .github/actions/check-semantic-line-breaks/fixtures/clean/**/*.md

      - name: Wiring smoke test (ignore)
        uses: ./.github/actions/check-semantic-line-breaks
        with:
          globs: .github/actions/check-semantic-line-breaks/fixtures/**/*.md
          ignore: .github/actions/check-semantic-line-breaks/fixtures/violations

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every action has a test.sh and a job in this file
        run: |
          set -eu
          missing=""
          for dir in .github/actions/*/; do
            name="$(basename "$dir")"
            [ -x "$dir/test.sh" ] || missing="$missing $name(test.sh)"
            grep -q "^  $name:" .github/workflows/action-tests.yml || missing="$missing $name(job)"
          done
          if [ -n "$missing" ]; then
            echo "::error::composite actions missing tests:$missing — every action ships an executable test.sh and an isolated job in action-tests.yml"
            exit 1
          fi
