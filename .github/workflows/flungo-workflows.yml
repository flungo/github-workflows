# The jobs every consumer of this repository should run — the ones that keep a
# consumer's *relationship with flungo/github-workflows* healthy, as opposed to
# anything about the consumer's own code. Opt-in, per-consumer. Named for this
# repository because that is the family it describes; see ADR-012, and
# docs/runbooks/adopting-flungo-workflows.md for how to adopt it.
#
# version-check — "am I on a frozen major?". A consumer calls this on a
# schedule. It compares the flungo/github-workflows major(s) the consumer pins
# (read from the consumer's own workflow files) against the major published
# here that is currently *stable*, and — when the consumer is pinning a
# now-frozen major — opens (and later closes) a single tracking issue in the
# CONSUMER's own repo.
#
# Stable, not newest: cutting a major publishes it while its contract is still
# settling, and STABLE_MAJOR (declared in the release workflow on main, read
# there under either of its names) is bumped by hand
# once adopting it has proved that contract. Until then consumers are left on
# the previous major and told nothing. See ADR-014.
#
# The issue names the upgrade guide sections between the pinned major and the
# current one, in order, so the notice that a consumer is behind also says how
# to catch up (ADR-013). That body is built by the version-check-issue composite
# action rather than inline here, so the section span is unit-tested, and placed
# by the issue-upsert action, which is what keeps it to exactly one issue — see
# ADR-009 for why both come from a checkout of this repo at the workflow file's
# own commit.
#
# No credentials: it reads this (public) repo's v* branches with the caller's
# own repo-scoped GITHUB_TOKEN (public repo, so plain read works) and writes the
# issue in the caller's repo. The caller must grant `issues: write` (a reusable
# workflow's permissions only cap the token — see the adoption guide).
name: flungo/github-workflows

on:
  workflow_call:

jobs:
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      # This repo's composite actions can't be referenced by a local `./` path
      # from a reusable workflow (it would resolve against the caller's
      # checkout), so fetch them at the exact commit this workflow file was
      # taken from: the action always matches the ref the caller pinned — @v2,
      # or a feature branch under test. See ADR-009.
      - name: Fetch workflow actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github-workflows
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Find frozen pins
        id: survey
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const pOwner = 'flungo', pRepo = 'github-workflows';

            // 1. Majors this repo pins, read from its own workflow files. Only
            //    bare `@vN` refs are majors we track; SHA/branch/tag pins are skipped.
            const dir = '.github/workflows';
            const refRe = new RegExp(`${pOwner}/${pRepo}/[^@\\s'"]+@([^\\s'"]+)`, 'g');
            const pinned = new Map(); // major:int -> Set<file>
            let files = [];
            try { files = fs.readdirSync(dir).filter(f => /\.ya?ml$/.test(f)); } catch (e) {}
            for (const f of files) {
              const text = fs.readFileSync(path.join(dir, f), 'utf8');
              for (const m of text.matchAll(refRe)) {
                const mm = /^v(\d+)$/.exec(m[1]);
                if (!mm) continue;
                const major = parseInt(mm[1], 10);
                if (!pinned.has(major)) pinned.set(major, new Set());
                pinned.get(major).add(f);
              }
            }

            // 2. Latest major published by the producer (highest v<N> branch).
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: pOwner, repo: pRepo, per_page: 100,
            });
            const majors = branches
              .map(b => /^v(\d+)$/.exec(b.name)).filter(Boolean).map(x => parseInt(x[1], 10));
            if (majors.length === 0) {
              core.setFailed(`No v<N> branches found on ${pOwner}/${pRepo}.`);
              return;
            }
            const latest = Math.max(...majors);

            // 3. The major to prompt onto. Cutting a major publishes it but
            //    leaves it *settling* — its contract can still change in place
            //    while it is adopted — so the branch existing is not the signal
            //    to migrate. STABLE_MAJOR is, and it is promoted by hand
            //    (ADR-014). Read from main: the ref that always carries the
            //    current state, and the only one a consumer frozen on an older
            //    major can name without knowing what the newer ones are called.
            //
            //    Unreadable, absent or nonsense ⇒ fall back to `latest`, which
            //    is what this job did before the state existed. A prompt that
            //    comes early costs a week of premature attention; one that never
            //    comes is the silent drift ADR-004 exists to catch.
            //    The value is read by path, and the release workflow is due to
            //    be renamed to self-release.yml (docs/plans/v3-cut.md § Pre-cut
            //    work item 4). A copy of this job pinned to a frozen major can
            //    never learn a new path, so both names are tried — the newer
            //    one first — and only "neither carries the value" counts as
            //    unreadable.
            let target = latest;
            const releasePaths = [
              '.github/workflows/self-release.yml',
              '.github/workflows/release.yml',
            ];
            let declared = null;
            const misses = [];
            for (const path of releasePaths) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: pOwner, repo: pRepo, path, ref: 'main',
                });
                const text = Buffer.from(data.content || '', data.encoding || 'base64').toString('utf8');
                declared = /^\s*STABLE_MAJOR:\s*v(\d+)\s*$/m.exec(text);
                if (declared) break;
                misses.push(`${path} declares no STABLE_MAJOR`);
              } catch (e) {
                misses.push(`${path}: ${e.message}`);
              }
            }
            if (declared) {
              target = Math.min(parseInt(declared[1], 10), latest);
            } else {
              core.warning(`Could not read the stable major from ${pOwner}/${pRepo} (${misses.join('; ')}); treating v${latest} as stable.`);
            }
            if (target < latest) {
              core.notice(`v${latest} is published but still settling; checking against the stable major, v${target}.`);
            }

            // 4. Any pinned major below the stable one is frozen. Shaped for the
            //    version-check-issue action, which validates it again rather
            //    than trusting this.
            const stale = [...pinned.entries()]
              .filter(([maj]) => maj < target)
              .sort(([a], [b]) => a - b)
              .map(([major, set]) => ({ major, files: [...set].sort() }));

            core.setOutput('target', String(target));
            // Empty unless a newer major is settling — the issue says so rather
            // than leaving a consumer to wonder why it is sent to an older one.
            core.setOutput('settling', target < latest ? String(latest) : '');
            core.setOutput('stale', JSON.stringify(stale));

      - name: Build the migration issue
        id: issue
        uses: ./.github-workflows/.github/actions/version-check-issue
        with:
          stale: ${{ steps.survey.outputs.stale }}
          target: ${{ steps.survey.outputs.target }}
          settling: ${{ steps.survey.outputs.settling }}

      # The marker comes from the action that embedded it, never a second copy
      # of the literal — one place knows what to search for. An empty title is
      # how version-check-issue says nothing is stale, which is the signal to
      # close any issue a previous run opened.
      - name: Upsert or close the tracking issue
        uses: ./.github-workflows/.github/actions/issue-upsert
        with:
          marker: ${{ steps.issue.outputs.marker }}
          state: ${{ steps.issue.outputs.title != '' && 'present' || 'absent' }}
          title: ${{ steps.issue.outputs.title }}
          body: ${{ steps.issue.outputs.body }}
          label: github-workflows-version
          close-comment: >-
            No `flungo/github-workflows` ref is on a frozen major (the current
            stable major is v${{ steps.survey.outputs.target }}) — closing.
