# Reusable Markdown link validation, in two jobs gated on the caller's event:
#   internal — offline check of relative links + heading anchors. Blocking, on
#     every PR and push; deterministic, no network.
#   external — online sweep of external URLs. Meant for schedule/dispatch (never
#     a PR, so a flaky outage can't block a merge); reports via a single
#     auto-updated GitHub issue instead of failing.
#
# The caller owns the triggers (pull_request / push / schedule / workflow_dispatch)
# and path filters; these jobs select themselves from github.event_name. The
# caller keeps its own .lycheeignore (regenerate per-repo, don't copy).
name: Markdown links

on:
  workflow_call:
    secrets:
      LYCHEE_GITHUB_TOKEN:
        description: Namespaced PAT for the external sweep to reach other private repos. Required for the external job.
        required: false

jobs:
  internal:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: lychee (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline: only local files, no network requests.
          # --include-fragments: also validate #heading anchors, not just paths.
          args: --offline --include-fragments --no-progress '**/*.md'
          fail: true

  external:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: lychee (online)
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # No --offline: checks external URLs (and re-checks internal links +
          # anchors). .lycheeignore (repo root) whitelists URLs that legitimately
          # 403/404 while unauthenticated.
          args: --include-fragments --no-progress '**/*.md'
          fail: false          # report via issue; don't red-X the scheduled run
          output: ./lychee/out.md
          # Pass the namespaced PAT via the action's `token` INPUT, not a
          # step-level `env: GITHUB_TOKEN`: the action exports GITHUB_TOKEN from
          # INPUT_TOKEN (defaulting to the automatic repo-scoped github.token),
          # and that export clobbers any env we set — so an env-var token
          # silently loses to the default and can't reach other private repos.
          token: ${{ secrets.LYCHEE_GITHUB_TOKEN }}
      # After the sweep, never before it: the sparse checkout carries this
      # repo's own Markdown fixtures, which lychee would otherwise scan as if
      # they were the caller's.
      #
      # This repo's composite actions can't be referenced by a local `./` path
      # from a reusable workflow (it would resolve against the caller's
      # checkout), so fetch them at the exact commit this workflow file was
      # taken from: the action always matches the ref the caller pinned — @v2,
      # or a feature branch under test. See ADR-009.
      - name: Fetch workflow actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github-workflows
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Build the broken-links report
        id: report
        if: steps.lychee.outputs.exit_code != '0'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          report=$(cat ./lychee/out.md 2>/dev/null || true)
          [ -n "$report" ] || report='_See the workflow run for details._'
          # The marker belongs to the upsert step, which prepends it: one place
          # knows the string the next run searches for.
          delimiter=MARKDOWN_LINKS_REPORT_BODY
          {
            printf 'body<<%s\n' "$delimiter"
            cat <<EOF
          Broken external links found by the daily sweep ([run]($RUN_URL)).
          Fix the link or its target; whitelist a URL in \`.lycheeignore\` only if it legitimately 403/404s while unauthenticated.

          $report
          EOF
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # Idempotent, and one issue however many open issues the caller has: the
      # action finds the marked issue across every page, updates it in place
      # while links are broken, and comments-and-closes it once they resolve.
      # The marker it is given is the one it writes into the body.
      - name: Upsert / close the broken-links issue
        uses: ./.github-workflows/.github/actions/issue-upsert
        with:
          marker: '<!-- markdown-links-report -->'
          state: ${{ steps.lychee.outputs.exit_code != '0' && 'present' || 'absent' }}
          title: Broken external links (daily Markdown sweep)
          body: ${{ steps.report.outputs.body }}
          label: markdown-links
          close-comment: All external links resolve — closed by the daily sweep.
