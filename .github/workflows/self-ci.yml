# Self-CI for this repository: lint the reusable workflows with actionlint,
# hold the self- prefix convention, dogfood the repo's own reusable Markdown
# workflows against its docs, and report the release state (whether a cut major
# is still settling). The composite actions are tested separately, one isolated
# job per action, in self-action-tests.yml.
#
# This file is prefixed because it is this repository's own CI rather than one
# of the products — the distinction the workflow-scope job below enforces.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC — external URL sweep (markdown-links)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  workflow-scope:
    # The products are reusable workflows and nothing else. An unprefixed file
    # in .github/workflows/ is therefore callable only through workflow_call,
    # and anything this repository runs for itself carries the self- prefix.
    #
    # Guarded rather than left to habit because the two failures are quiet. A
    # product that picks up a `pull_request:` starts running here on every pull
    # request with none of a caller's inputs, and a self-CI workflow left
    # unprefixed reads as a product a consumer may call. The prefix is the
    # visible half of the separation; this job is the half that cannot be
    # forgotten.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every unprefixed workflow is workflow_call-only
        run: |
          set -euo pipefail
          status=0
          for file in .github/workflows/*.y*ml; do
            name="$(basename "$file")"
            case "$name" in self-*) continue ;; esac
            # The triggers are the keys of the `on:` block: the lines indented
            # under it, up to the next top-level key. An `on:` this cannot read
            # — an inline `on: [push]`, or none at all — reports empty and
            # fails, because a trigger set nothing here can check is not one to
            # take on trust.
            triggers="$(awk '
              /^on:/                      { inside = 1; next }
              inside && /^[^[:space:]#]/  { inside = 0 }
              inside && /^  [A-Za-z_]+:/  { sub(/:.*/, ""); gsub(/ /, ""); print }
            ' "$file" | sort -u | paste -sd, -)"
            if [ "$triggers" != workflow_call ]; then
              echo "::error file=$file::$name is unprefixed, so it is one of the products and must be workflow_call-only; its triggers read '${triggers:-none this job can parse}'. If it is this repository's own CI, rename it self-$name."
              status=1
            fi
          done
          exit "$status"

  release-state:
    # Surfaces a major that is cut but still settling (MAJOR_BRANCH ahead of
    # STABLE_MAJOR — ADR-014), so the divergence is visible on every pull
    # request rather than something anyone has to remember to look for.
    #
    # The divergence itself only warns: settling is a legitimate state to merge
    # onto and can last as long as adopting the major takes. It *fails* on a
    # pair that cannot be right, and on a README that misdescribes the state —
    # both would send a new adopter or a consumer's version-check to the wrong
    # major, which is the one thing this is here to prevent.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the cut major with the stable one
        run: |
          set -euo pipefail
          file=.github/workflows/self-release.yml
          readme=README.md
          runbook=docs/runbooks/releasing.md#the-settling-period

          die() { echo "::error file=$1::$2"; exit 1; }

          value=''
          read_major() {
            local name=$1 count
            value=$(sed -n "s/^  ${name}: *\(v[0-9][0-9]*\) *\$/\1/p" "$file")
            count=$(printf '%s\n' "$value" | grep -c . || true)
            if [ "$count" -ne 1 ]; then
              die "$file" "$name must appear exactly once as a bare vN value; found $count."
            fi
          }

          read_major MAJOR_BRANCH; major=$value
          read_major STABLE_MAJOR; stable=$value

          if [ "${stable#v}" -gt "${major#v}" ]; then
            die "$file" "STABLE_MAJOR ($stable) is ahead of MAJOR_BRANCH ($major) — a major cannot be stable before it is cut."
          fi

          # The README pins its adoption-runbook links to the stable major, so a
          # new adopter reads instructions, a pin and onward links that agree.
          # Bumping them is part of promoting; this is what makes it unforgettable.
          # `|| true` so no matches reaches the check below as an empty string
          # rather than killing the pipeline under pipefail.
          refs=$(grep -oE 'blob/v[0-9]+/docs/runbooks/' "$readme" | cut -d/ -f2 | sort -u || true)
          if [ -z "$refs" ]; then
            die "$readme" "no adoption-runbook links pinned to a major branch — they should read blob/$stable/docs/runbooks/… ($runbook)."
          fi
          if [ "$refs" != "$stable" ]; then
            die "$readme" "adoption-runbook links are pinned to $(echo "$refs" | tr '\n' ' ')but the stable major is $stable ($runbook)."
          fi

          # The callout exists exactly while a major is settling.
          # Matched as the exact marker, not the bare word: the README's own
          # placement note mentions the markers by name.
          if grep -qF -- '<!-- settling:start -->' "$readme"; then
            has_callout=yes
          else
            has_callout=no
          fi

          if [ "$stable" = "$major" ]; then
            if [ "$has_callout" = yes ]; then
              die "$readme" "$major is stable, so the settling callout should have been removed when it was promoted ($runbook)."
            fi
            echo "Release state: $major is cut and stable; README pins $stable."
            exit 0
          fi

          if [ "$has_callout" = no ]; then
            die "$readme" "$major is cut and still settling, so the README needs the settling callout — otherwise someone landing here adopts a contract that can still change ($runbook)."
          fi
          # A callout left over from an earlier cut is worse than none: it names
          # the wrong majors with full confidence.
          callout=$(sed -n '/<!-- settling:start -->/,/<!-- settling:end -->/p' "$readme")
          for named in "$major" "$stable"; do
            if ! printf '%s\n' "$callout" | grep -qE "(^|[^0-9A-Za-z])$named([^0-9]|\$)"; then
              die "$readme" "the settling callout does not name $named; it should say $major is settling and $stable is what to adopt ($runbook)."
            fi
          done

          line=$(grep -n '^  STABLE_MAJOR:' "$file" | cut -d: -f1)
          echo "::warning file=$file,line=$line::$major is cut but still settling — consumers are still pointed at $stable, and its contract can still change in place. Promote it by setting STABLE_MAJOR to $major once adopting it has proved the contract (docs/runbooks/releasing.md § Promoting a major to stable)."

  markdown-lint:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: ./.github/workflows/markdown-lint.yml

  markdown-sembr:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: ./.github/workflows/markdown-sembr.yml
    with:
      # The violating fixture exists to be flagged — self-action-tests.yml asserts
      # the check fails on it — so it is the one file the repo's own run must
      # skip. Its sibling under fixtures/clean/ stays in scope, and dogfooding
      # `ignore` is worth more than a `<!-- sembr-disable-file -->` comment
      # here, which would also blind the tests that need the failure.
      ignore: .github/actions/check-semantic-line-breaks/fixtures/violations
      # This repo is the exception the input exists for (ADR-016). Its
      # markdownlint config skips the whole fixtures tree — style rules fight
      # the constructs those files exist to exercise — while this run wants
      # only violations/ skipped. Inheriting would take fixtures/clean/ with
      # it, silently dropping the file that proves the check stays quiet, and
      # would make the ignore above redundant — and that line is load-bearing:
      # ADR-009's checkout exclusion regresses here if it is ever dropped.
      inherit-markdownlint-ignores: false

  markdown-links:
    # Internal (offline, blocking) on PR/push; external (issue-reporting) on the
    # daily schedule / dispatch — the reusable workflow self-selects by event.
    uses: ./.github/workflows/markdown-links.yml
    permissions:
      contents: read
      issues: write
    secrets:
      LYCHEE_GITHUB_TOKEN: ${{ secrets.LYCHEE_GITHUB_TOKEN }}
