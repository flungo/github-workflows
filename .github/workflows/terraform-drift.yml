# Reusable daily drift-remediation workflow.
#
# Applies the caller's default branch on a schedule so live state cannot
# silently diverge. Never auto-applies destroys (opens a review issue instead),
# opens/closes a `drift`-labelled issue to notify, and honours two pause
# mechanisms in the caller repo: the DRIFT_REMEDIATION_PAUSED variable (quick)
# and a committed .drift-paused file (auditable). Opt-in — wire this only for
# repos with auto-rotating credentials that must stay authoritative.
#
# The caller keeps the `schedule` trigger (reusable workflows can't be
# scheduled directly) and passes force_run through from its workflow_dispatch.
#
# working-directory is set per-step (not via `defaults.run`): defaults.run does
# not evaluate ${{ }} expressions.
name: Terraform Drift Remediation

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to run Terraform in (the root module).
        type: string
        default: '.'
      terraform-version:
        description: Terraform version for setup-terraform (default latest).
        type: string
        default: latest
      concurrency-group:
        description: Concurrency group; share it with the caller's plan/apply workflow.
        type: string
        default: terraform
      tf-var-name:
        description: Env var name for the provider token, e.g. TF_VAR_github_token. Empty = none.
        type: string
        default: ''
      tf_vars:
        description: >-
          Optional JSON object {"<var>": "<value>", ...} of extra *non-secret*
          Terraform variables, each exported as an unmasked TF_VAR_<var>;
          values are strings. A secret value belongs in the tf_secret_vars
          secret instead. Mirror the caller's terraform.yml so scheduled drift
          runs the same config.
        type: string
        default: ''
      force_run:
        description: Run even if remediation is paused (variable or .drift-paused file).
        type: boolean
        default: false
    secrets:
      TF_TOKEN_APP_TERRAFORM_IO:
        description: HCP Terraform token for the state backend.
        required: true
      provider_token:
        description: Provider credential, exported as ${tf-var-name} for Terraform.
        required: false
      tf_secret_vars:
        description: >-
          Optional JSON object {"<var>": "<value>", ...} of extra *secret*
          Terraform variables — every value is masked and treated as a secret.
          Each is exported as a masked TF_VAR_<var>. For a secret the config
          consumes beyond the provider token — e.g. a database password or an API
          key a resource needs — declare the consuming variable sensitive so plan
          output (and the drift issue) redacts it. Mirror the caller's
          terraform.yml so scheduled drift runs the same config.
        required: false

concurrency:
  group: ${{ inputs.concurrency-group }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    if: vars.DRIFT_REMEDIATION_PAUSED != 'true' || inputs.force_run
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v7

      # The DRIFT_REMEDIATION_PAUSED repository variable is the quick, unaudited
      # emergency brake (handled by the job-level `if`). A committed .drift-paused
      # file is the auditable brake for a change set spanning multiple PRs: drop
      # it in the first PR, remove it in the last. force_run overrides both.
      - name: Check committed pause
        id: pause
        run: |
          if [ -f .drift-paused ] && [ "${{ inputs.force_run }}" != "true" ]; then
            echo "::notice::Drift remediation paused by committed .drift-paused file; skipping."
            echo "----- .drift-paused -----"
            cat .drift-paused
            echo "paused=true" >> "$GITHUB_OUTPUT"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      # This repo's composite actions can't be referenced by a local `./` path
      # from a reusable workflow (it would resolve against the caller's
      # checkout), so fetch them at the exact commit this workflow file was
      # taken from: the action always matches the ref the caller pinned — @v2,
      # or a feature branch under test. See ADR-009.
      - name: Fetch workflow actions
        if: steps.pause.outputs.paused != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github-workflows
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Export Terraform variables
        if: steps.pause.outputs.paused != 'true'
        uses: ./.github-workflows/.github/actions/export-terraform-variables
        with:
          tf-var-name: ${{ inputs.tf-var-name }}
          provider-token: ${{ secrets.provider_token }}
          secret-vars: ${{ secrets.tf_secret_vars }}
          vars: ${{ inputs.tf_vars }}

      - uses: hashicorp/setup-terraform@v4
        if: steps.pause.outputs.paused != 'true'
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Init
        if: steps.pause.outputs.paused != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: terraform init

      - name: Plan
        id: plan
        if: steps.pause.outputs.paused != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          EXITCODE=$?
          echo "exitcode=$EXITCODE" >> "$GITHUB_OUTPUT"
          if grep -qE '^Plan:.*[1-9][0-9]* to destroy' plan.txt; then
            echo "has_destroys=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_destroys=false" >> "$GITHUB_OUTPUT"
          fi
          cat plan.txt

      - name: Apply
        id: apply
        if: steps.plan.outputs.exitcode == '2' && steps.plan.outputs.has_destroys != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: terraform apply -auto-approve -no-color tfplan

      # One step builds the issue for either outcome: they differ in their
      # marker, their title and their opening sentence, and in nothing else.
      # The markers are two because the conditions are — a destroy plan
      # awaiting a human must not be overwritten by a later run that
      # remediated something else.
      - name: Build the drift issue
        id: drift-issue
        if: steps.plan.outputs.exitcode == '2' && (steps.plan.outputs.has_destroys == 'true' || steps.apply.outcome == 'success')
        env:
          WORKDIR: ${{ inputs.working-directory }}
          HAS_DESTROYS: ${{ steps.plan.outputs.has_destroys }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          plan_file="${WORKDIR:-.}/plan.txt"

          # An issue body is capped at 65 536 characters and the wrapper below
          # costs a few hundred; 60 000 leaves room and matches the limit
          # terraform.yml's plan comment uses. iconv drops whatever partial
          # character the byte-wise cut left behind, so the body stays valid
          # UTF-8 for the API.
          limit=60000
          if [ "$(wc -c <"$plan_file")" -gt "$limit" ]; then
            plan="$(head -c "$limit" "$plan_file" | iconv -f UTF-8 -t UTF-8 -c)
          ...(truncated — see job logs for full output)"
          else
            plan="$(cat "$plan_file")"
          fi

          if [ "$HAS_DESTROYS" = "true" ]; then
            marker='<!-- terraform-drift-review -->'
            title="Terraform drift requires manual review (destroys detected) — $(date -u +%F)"
            opening='Drift was detected but **not automatically applied** because the plan contains resource destructions.
          Manual review and apply is required.'
          else
            marker='<!-- terraform-drift -->'
            title="Terraform drift detected and remediated — $(date -u +%F)"
            opening='Drift was detected and remediated by the daily drift-remediation workflow.'
          fi

          body="$(cat <<EOF
          $opening

          **Run:** $RUN_URL

          <details><summary>Plan output</summary>

          \`\`\`
          $plan
          \`\`\`
          </details>
          EOF
          )"

          delimiter=TERRAFORM_DRIFT_ISSUE
          {
            printf 'marker=%s\n' "$marker"
            printf 'title=%s\n' "$title"
            printf 'body<<%s\n%s\n%s\n' "$delimiter" "$body" "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # Skipped steps leave their outputs empty, so this runs exactly when the
      # step above did. The action keeps one issue per marker in sync rather
      # than opening another every day the same drift is found.
      - name: Open or update the drift issue
        if: steps.drift-issue.outputs.title != ''
        uses: ./.github-workflows/.github/actions/issue-upsert
        with:
          marker: ${{ steps.drift-issue.outputs.marker }}
          title: ${{ steps.drift-issue.outputs.title }}
          body: ${{ steps.drift-issue.outputs.body }}
          label: drift
          label-color: e11d48
          label-description: Terraform drift was detected and remediated

      # A clean run clears both conditions, so both markers are closed — one
      # step each, because each names the issue it is closing. The outcome
      # check is load-bearing: when the pause skips the plan, its exitcode is
      # null, which the expression engine coerces to 0 and so equates with
      # '0'. Without it these steps would run on every paused day, against an
      # actions checkout the pause also skipped.
      - name: Close the remediated-drift issue on a clean run
        if: steps.plan.outcome == 'success' && steps.plan.outputs.exitcode == '0'
        uses: ./.github-workflows/.github/actions/issue-upsert
        with:
          marker: '<!-- terraform-drift -->'
          state: absent
          label: drift
          close-comment: No drift detected by the daily drift-remediation run ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})) — closing.

      - name: Close the destroy-review issue on a clean run
        if: steps.plan.outcome == 'success' && steps.plan.outputs.exitcode == '0'
        uses: ./.github-workflows/.github/actions/issue-upsert
        with:
          marker: '<!-- terraform-drift-review -->'
          state: absent
          label: drift
          close-comment: The destroys this issue was raised for are no longer in the plan ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})) — closing.

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
