# Reusable Terraform plan/apply workflow.
#
# Plan on pull_request (posted as an upserted PR comment), apply on push to the
# caller's default branch or on a workflow_dispatch with operation=apply. HCP
# Terraform in Local execution mode — this runner is the executor; HCP holds
# state only. See docs/terraform-workflow.md for the full contract.
#
# The provider token is passed generically: the caller supplies `tf-var-name`
# (the TF_VAR_* env var name) and the `provider_token` secret, so this file
# names no specific provider. Any further secret values the config needs (e.g. a
# database password or an API key a resource is configured with) come through the
# `tf_secret_vars` secret — a JSON map exported as masked TF_VAR_* env vars — and
# non-secret extra variables through the `tf_vars` input the same way (unmasked) —
# so this file names no specific variable either.
#
# working-directory is set per-step (not via `defaults.run`): defaults.run
# does not evaluate ${{ }} expressions.
name: Terraform

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to run Terraform in (the root module).
        type: string
        default: '.'
      terraform-version:
        description: Terraform version for setup-terraform (default latest).
        type: string
        default: latest
      concurrency-group:
        description: Concurrency group; share it with the caller's drift workflow so the two never overlap.
        type: string
        default: terraform
      plan-comment-marker:
        description: Hidden marker used to find and update this repo's plan comment.
        type: string
        default: '<!-- terraform-plan -->'
      plan-artifact-name:
        description: Name the plan (plan.jsonl, plan.txt) is uploaded under, so a caller's follow-on jobs can consume it.
        type: string
        default: terraform-plan
      tf-var-name:
        description: Env var name for the provider token, e.g. TF_VAR_github_token. Empty = no provider token.
        type: string
        default: ''
      tf_vars:
        description: >-
          Optional JSON object {"<var>": "<value>", ...} of extra *non-secret*
          Terraform variables, each exported as an unmasked TF_VAR_<var>;
          values are strings (multi-line is fine). Workflow inputs are plainly
          visible in the run — a secret value belongs in the tf_secret_vars
          secret instead, never here.
        type: string
        default: ''
      operation:
        description: >-
          Pass-through of the caller's workflow_dispatch operation input: plan
          or apply. Empty means plan (the events that are not
          workflow_dispatch render a caller's pass-through expression that
          way); any other value fails the run rather than planning.
        type: string
        default: plan
    secrets:
      TF_TOKEN_APP_TERRAFORM_IO:
        description: HCP Terraform token for the state backend.
        required: true
      provider_token:
        description: Provider credential, exported as ${tf-var-name} for Terraform.
        required: false
      tf_secret_vars:
        description: >-
          Optional JSON object {"<var>": "<value>", ...} of extra *secret*
          Terraform variables — every value is masked and treated as a secret
          (non-secret vars don't belong here). Each is exported as a masked
          TF_VAR_<var>; values are strings (a map/list would be stringified,
          multi-line is fine). For a secret the config consumes beyond the
          provider token — e.g. a database password or an API key a resource
          needs — declare the consuming variable sensitive so plan output
          redacts it.
        required: false

concurrency:
  group: ${{ inputs.concurrency-group }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      TF_INPUT: "false"
    steps:
      # Any value other than `apply` used to fall through to a plan, so a
      # typo'd dispatch (`aply`) reported success having done something other
      # than what was asked — and on a push it applied, since that arm never
      # reads the operation. Reject it here, before the checkout, the init and
      # the plan: ADR-008's fail-at-the-point-of-error, applied to this input.
      # An empty value is not a typo but the shape of the caller's own
      # expression on an event that carries no dispatch inputs, so it means the
      # documented default.
      - name: Check the operation input
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          case "$OPERATION" in
            ''|plan|apply) ;;
            *)
              echo "::error::operation must be 'plan' or 'apply' (got '$OPERATION')"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7

      # This repo's composite actions can't be referenced by a local `./` path
      # from a reusable workflow (it would resolve against the caller's
      # checkout), so fetch them at the exact commit this workflow file was
      # taken from: the action always matches the ref the caller pinned — @v2,
      # or a feature branch under test. See ADR-009.
      - name: Fetch workflow actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github-workflows
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Export Terraform variables
        uses: ./.github-workflows/.github/actions/export-terraform-variables
        with:
          tf-var-name: ${{ inputs.tf-var-name }}
          provider-token: ${{ secrets.provider_token }}
          secret-vars: ${{ secrets.tf_secret_vars }}
          vars: ${{ inputs.tf_vars }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Init
        working-directory: ${{ inputs.working-directory }}
        run: terraform init

      - name: Format
        id: fmt
        working-directory: ${{ inputs.working-directory }}
        run: terraform fmt -check
        continue-on-error: true

      - name: Validate
        id: validate
        working-directory: ${{ inputs.working-directory }}
        run: terraform validate -no-color

      - name: Plan
        id: plan
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -o pipefail
          terraform plan -json -out=tfplan | tee plan.jsonl
        continue-on-error: true

      - name: Plan display
        id: plan_show
        if: steps.plan.outcome == 'success'
        working-directory: ${{ inputs.working-directory }}
        run: terraform show -no-color tfplan > plan.txt
        continue-on-error: true

      # Publish the plan as an artifact so a caller's follow-on jobs can consume it
      # (e.g. surface diagnostics from a failed plan without re-running it). Uploaded
      # on success and failure alike — plan.jsonl carries the JSON diagnostics even
      # when the plan errored; plan.txt is absent on failure, hence if-no-files-found.
      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.plan-artifact-name }}
          path: |
            ${{ inputs.working-directory }}/plan.jsonl
            ${{ inputs.working-directory }}/plan.txt
          retention-days: 1
          if-no-files-found: ignore

      # Building the comment and placing it are two steps: the body comes from
      # this run's plan and the outcomes of the steps above, while keeping one
      # comment current across a pull request's pushes is the shared
      # pr-comment-upsert action's job (ADR-018). The marker is the action's to
      # write — it prepends it — so the body below does not carry one.
      - name: Build the plan comment
        id: plan_comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          WORKDIR: ${{ inputs.working-directory }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const wd = process.env.WORKDIR || '.';

            // Parse the JSONL plan output to find the change_summary message.
            let summary = '';
            let emoji = '❓';
            const jsonlPath = path.join(wd, 'plan.jsonl');
            const planJson = fs.existsSync(jsonlPath) ? fs.readFileSync(jsonlPath, 'utf8') : '';
            for (const line of planJson.split('\n')) {
              if (!line.trim()) continue;
              try {
                const msg = JSON.parse(line);
                if (msg.type === 'change_summary') {
                  const { add = 0, change = 0, remove = 0 } = msg.changes;
                  summary = msg['@message'];
                  emoji = remove > 0 ? '🔴' : change > 0 ? '🟡' : add > 0 ? '🟢' : '⚪';
                  break;
                }
              } catch {}
            }
            if (!summary) summary = 'Plan summary unavailable';

            const txtPath = path.join(wd, 'plan.txt');
            const planText = fs.existsSync(txtPath) ? fs.readFileSync(txtPath, 'utf8') : '';
            // 60 000, the same limit terraform-drift.yml's issue body uses: a
            // comment is capped at 65 536 characters and the table, summary and
            // details wrapper around the plan cost a few hundred more.
            const planDisplay = planText.length > 60000
              ? planText.substring(0, 60000) + '\n...(truncated, see job logs for full output)'
              : planText;
            const body = [
              `| Format | Validate | Plan |`,
              `|---|---|---|`,
              `| \`${{ steps.fmt.outcome }}\` | \`${{ steps.validate.outcome }}\` | \`${{ steps.plan.outcome }}\` |`,
              '',
              `${emoji} ${summary}`,
              '',
              '<details><summary>Plan output</summary>',
              '',
              '```hcl',
              planDisplay,
              '```',
              '</details>',
            ].join('\n');
            core.setOutput('body', body);

      # The action finds the marked comment across every page of the thread,
      # so a pull request carries one plan comment describing its current head,
      # however long the discussion on it has grown.
      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: ./.github-workflows/.github/actions/pr-comment-upsert
        with:
          marker: ${{ inputs.plan-comment-marker }}
          body: ${{ steps.plan_comment.outputs.body }}

      - name: Fail on plan error
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Apply
        if: >-
          steps.plan.outcome == 'success' && (
            (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
            (github.event_name == 'workflow_dispatch' && inputs.operation == 'apply')
          )
        working-directory: ${{ inputs.working-directory }}
        run: terraform apply -auto-approve tfplan
