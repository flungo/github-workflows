# Reusable "am I on a frozen major?" check — opt-in, per-consumer.
#
# A consumer calls this on a schedule. It compares the flungo/github-workflows
# major(s) the consumer pins (read from the consumer's own workflow files)
# against the latest major published here, and — when the consumer is pinning a
# now-frozen major — opens (and later closes) a single tracking issue in the
# CONSUMER's own repo. See docs/runbooks/adopting-version-check.md.
#
# A freshly cut major has a grace period (GRACE_DAYS below) during which its
# contract is still settling and nobody is prompted onto it — see
# docs/decisions/014-grace-period-before-prompting-a-new-major.md.
#
# No credentials: it reads this (public) repo's v* branches with the caller's
# own repo-scoped GITHUB_TOKEN (public repo, so plain read works) and writes the
# issue in the caller's repo. The caller must grant `issues: write` (a reusable
# workflow's permissions only cap the token — see the adoption guide).
name: Version check

on:
  workflow_call:

jobs:
  version-check:
    # Named for the upstream repo it checks, so the check reads unambiguously in
    # a consumer's checks list (not "a version check of something unspecified").
    name: github-workflows version check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Compare pinned major against the latest published
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const pOwner = 'flungo', pRepo = 'github-workflows';
            const { owner, repo } = context.repo;
            const label = 'github-workflows-version';
            const marker = '<!-- github-workflows-version-check -->';

            // 1. Majors this repo pins, read from its own workflow files. Only
            //    bare `@vN` refs are majors we track; SHA/branch/tag pins are skipped.
            const dir = '.github/workflows';
            const refRe = new RegExp(`${pOwner}/${pRepo}/[^@\\s'"]+@([^\\s'"]+)`, 'g');
            const pinned = new Map(); // major:int -> Set<file>
            let files = [];
            try { files = fs.readdirSync(dir).filter(f => /\.ya?ml$/.test(f)); } catch (e) {}
            for (const f of files) {
              const text = fs.readFileSync(path.join(dir, f), 'utf8');
              for (const m of text.matchAll(refRe)) {
                const mm = /^v(\d+)$/.exec(m[1]);
                if (!mm) continue;
                const major = parseInt(mm[1], 10);
                if (!pinned.has(major)) pinned.set(major, new Set());
                pinned.get(major).add(f);
              }
            }

            // 2. Latest major published by the producer (highest v<N> branch).
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: pOwner, repo: pRepo, per_page: 100,
            });
            const majors = branches
              .map(b => /^v(\d+)$/.exec(b.name)).filter(Boolean).map(x => parseInt(x[1], 10));
            if (majors.length === 0) {
              core.setFailed(`No v<N> branches found on ${pOwner}/${pRepo}.`);
              return;
            }
            const latest = Math.max(...majors);

            // 3. Grace period. For GRACE_DAYS after a major is cut its contract
            //    is still settling — it may take further breaking changes in
            //    place — so consumers are not prompted onto it yet (ADR-014).
            //    Nothing records when a branch was created, so the cut is dated
            //    from the OLDEST commit v<latest> has that v<latest-1> does not:
            //    the merge that bumped MAJOR_BRANCH, which is the commit
            //    release.yml created the branch at. Comparing against the
            //    previous major (rather than reading v<latest>'s tip) keeps that
            //    date fixed as the new major advances, and survives a backport
            //    landing on the old one.
            const GRACE_DAYS = 7;
            let cutAt = null;
            if (majors.includes(latest - 1)) {
              try {
                const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                  owner: pOwner, repo: pRepo, basehead: `v${latest - 1}...v${latest}`, per_page: 1,
                });
                const cut = cmp.commits[0]?.commit?.committer?.date;
                if (cut) cutAt = new Date(cut);
              } catch (e) {
                core.warning(`Could not date the v${latest} cut: ${e.message}`);
              }
            }
            // Undatable (no previous major, no commits, API error) counts as
            // spent: a prompt that comes early beats one that never comes.
            const graceEnds = cutAt && new Date(cutAt.getTime() + GRACE_DAYS * 86400000);
            const inGrace = Boolean(graceEnds) && graceEnds > new Date();
            const day = d => d.toISOString().slice(0, 10);
            // The major consumers are prompted onto: the newest one out of grace.
            const current = inGrace ? latest - 1 : latest;
            if (inGrace) {
              core.notice(`v${latest} was cut on ${day(cutAt)} and is inside its ${GRACE_DAYS}-day grace period (until ${day(graceEnds)}); checking against v${current} until then.`);
            }

            // 4. Any pinned major below the current one is frozen.
            const stale = [...pinned.entries()].filter(([maj]) => maj < current).sort();

            // 5. Upsert / close one tracking issue in the caller's repo.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            const existing = open.find(i => (i.body || '').includes(marker));

            if (stale.length > 0) {
              const lines = stale.map(([maj, set]) =>
                `- \`@v${maj}\` (frozen) in ${[...set].sort().map(f => `\`${f}\``).join(', ')} → migrate to \`@v${current}\``);
              const body = [
                marker,
                `\`${pOwner}/${pRepo}\` has published **v${current}**, but this repo still pins an older, now-frozen major:`,
                '',
                ...lines,
                '',
                `A frozen major receives no further updates. Bump the caller \`uses: …@vN\` refs to \`@v${current}\` once you've accommodated the breaking change — see ${pOwner}/${pRepo} \`docs/runbooks/releasing.md\`.`,
                ...(inGrace ? [
                  '',
                  `\`v${latest}\` has also been published, but it is inside its ${GRACE_DAYS}-day grace period until ${day(graceEnds)} — its contract can still change, so migrate to \`@v${current}\` for now. This issue moves on to \`@v${latest}\` once that passes.`,
                ] : []),
                '',
                '_Raised by the opt-in `version-check` workflow; it closes this issue automatically once no ref is on a frozen major._',
              ].join('\n');
              const title = `Pinned ${pRepo} major is frozen — v${current} available`;
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body });
                core.notice(`Updated migration issue #${existing.number}.`);
              } else {
                const { data } = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
                core.notice(`Opened migration issue #${data.number}.`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: inGrace
                  ? `No \`${pOwner}/${pRepo}\` ref is on a frozen major (\`v${latest}\` is inside its ${GRACE_DAYS}-day grace period until ${day(graceEnds)}) — closing.`
                  : `All \`${pOwner}/${pRepo}\` refs are on the latest major (v${latest}) — closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info(`Closed migration issue #${existing.number}.`);
            } else if (inGrace) {
              core.info(`Up to date: all pins on v${current} or later; v${latest} is inside its grace period.`);
            } else {
              core.info(`Up to date: all pins on the latest major (v${latest}).`);
            }
