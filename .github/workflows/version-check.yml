# Reusable "am I on a frozen major?" check — opt-in, per-consumer.
#
# A consumer calls this on a schedule. It compares the flungo/github-workflows
# major(s) the consumer pins (read from the consumer's own workflow files)
# against the latest major published here, and — when the consumer is pinning a
# now-frozen major — opens (and later closes) a single tracking issue in the
# CONSUMER's own repo. See docs/runbooks/adopting-version-check.md.
#
# The issue names the upgrade guide sections between the pinned major and the
# current one, in order, so the notice that a consumer is behind also says how
# to catch up (ADR-013). That body is built by the version-check-issue composite
# action rather than inline here, so the section span is unit-tested — see
# ADR-009 for why the action comes from a checkout of this repo at the
# workflow file's own commit.
#
# No credentials: it reads this (public) repo's v* branches with the caller's
# own repo-scoped GITHUB_TOKEN (public repo, so plain read works) and writes the
# issue in the caller's repo. The caller must grant `issues: write` (a reusable
# workflow's permissions only cap the token — see the adoption guide).
name: Version check

on:
  workflow_call:

jobs:
  version-check:
    # Named for the upstream repo it checks, so the check reads unambiguously in
    # a consumer's checks list (not "a version check of something unspecified").
    name: github-workflows version check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      # This repo's composite actions can't be referenced by a local `./` path
      # from a reusable workflow (it would resolve against the caller's
      # checkout), so fetch them at the exact commit this workflow file was
      # taken from: the action always matches the ref the caller pinned — @v1,
      # or a feature branch under test. See ADR-009.
      - name: Fetch workflow actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github-workflows
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Find frozen pins
        id: survey
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const pOwner = 'flungo', pRepo = 'github-workflows';

            // 1. Majors this repo pins, read from its own workflow files. Only
            //    bare `@vN` refs are majors we track; SHA/branch/tag pins are skipped.
            const dir = '.github/workflows';
            const refRe = new RegExp(`${pOwner}/${pRepo}/[^@\\s'"]+@([^\\s'"]+)`, 'g');
            const pinned = new Map(); // major:int -> Set<file>
            let files = [];
            try { files = fs.readdirSync(dir).filter(f => /\.ya?ml$/.test(f)); } catch (e) {}
            for (const f of files) {
              const text = fs.readFileSync(path.join(dir, f), 'utf8');
              for (const m of text.matchAll(refRe)) {
                const mm = /^v(\d+)$/.exec(m[1]);
                if (!mm) continue;
                const major = parseInt(mm[1], 10);
                if (!pinned.has(major)) pinned.set(major, new Set());
                pinned.get(major).add(f);
              }
            }

            // 2. Latest major published by the producer (highest v<N> branch).
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: pOwner, repo: pRepo, per_page: 100,
            });
            const majors = branches
              .map(b => /^v(\d+)$/.exec(b.name)).filter(Boolean).map(x => parseInt(x[1], 10));
            if (majors.length === 0) {
              core.setFailed(`No v<N> branches found on ${pOwner}/${pRepo}.`);
              return;
            }
            const latest = Math.max(...majors);

            // 3. Any pinned major below the latest is frozen. Shaped for the
            //    version-check-issue action, which validates it again rather
            //    than trusting this.
            const stale = [...pinned.entries()]
              .filter(([maj]) => maj < latest)
              .sort(([a], [b]) => a - b)
              .map(([major, set]) => ({ major, files: [...set].sort() }));

            core.setOutput('latest', String(latest));
            core.setOutput('stale', JSON.stringify(stale));

      - name: Build the migration issue
        id: issue
        uses: ./.github-workflows/.github/actions/version-check-issue
        with:
          stale: ${{ steps.survey.outputs.stale }}
          latest: ${{ steps.survey.outputs.latest }}

      - name: Upsert or close the tracking issue
        uses: actions/github-script@v9
        env:
          STALE: ${{ steps.survey.outputs.stale }}
          LATEST: ${{ steps.survey.outputs.latest }}
          MARKER: ${{ steps.issue.outputs.marker }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'github-workflows-version';
            // From the action, not a second copy of the literal: it embeds the
            // marker, so it is the only thing that knows what to search for.
            const marker = process.env.MARKER;
            const stale = JSON.parse(process.env.STALE || '[]');
            const latest = process.env.LATEST;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            const existing = open.find(i => (i.body || '').includes(marker));

            if (stale.length > 0) {
              const title = process.env.ISSUE_TITLE;
              const body = process.env.ISSUE_BODY;
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body });
                core.notice(`Updated migration issue #${existing.number}.`);
              } else {
                const { data } = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
                core.notice(`Opened migration issue #${data.number}.`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `All \`flungo/github-workflows\` refs are on the latest major (v${latest}) — closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info(`Closed migration issue #${existing.number}.`);
            } else {
              core.info(`Up to date: all pins on the latest major (v${latest}).`);
            }
